<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрестики-Нулики</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="https://www.svgrepo.com/show/398565/video-game.svg">
</head>

<body>

    <h1>Хрестики-Нулики</h1>

    <!-- Блок вибору складності -->
    <div class="difficulty-container">
        <span>Складність:</span>
        <button class="diff-btn active" data-diff="easy">Легка</button>
        <button class="diff-btn" data-diff="medium">Середня</button>
        <button class="diff-btn" data-diff="hard">Неможлива</button>
    </div>

    <div class="status" id="status">Зараз твій хід (X)</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="restartBtn">Почати заново</button>

    <script src="script.js"></script>
</body>

</html>
